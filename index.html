<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bita Negahdar | Psychology</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   GLOBAL HOME PAGE
===================================================== */

*{
    box-sizing:border-box;
}

body{
    background:#F3EBDD !important;
    color:#292825;
    font-family:"DM Sans",Arial,sans-serif !important;
    font-weight:400;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

header{
    width:100%;
    height:68px;

    padding:0 4vw;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#F3EBDD;

    border-bottom:1px solid #D8CCB9;
}

.logo{
    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:20px !important;
    font-weight:700 !important;

    letter-spacing:2.2px;

    color:#292825;
}

nav{
    display:flex;
    align-items:center;

    gap:30px;
}

nav a{
    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:11px !important;
    font-weight:500;

    letter-spacing:1.5px;

    text-transform:uppercase;

    color:#292825;

    transition:
        color .25s ease,
        background-color .25s ease;
}

nav a:not(.contact-btn):hover{
    color:#3F8580;
}

.contact-btn{
    padding:10px 18px;

    background:#3F8580;

    color:#F8F2E8 !important;

    border:1px solid #3F8580;

    transition:
        background-color .3s ease,
        border-color .3s ease;
}

.contact-btn:hover{
    background:#286C70;
    border-color:#286C70;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:94%;
    max-width:1500px;

    margin:18px auto 0;

    display:grid;

    grid-template-columns:44% 56%;

    min-height:560px;
}


/* LEFT COLORED AREA */

.hero-text{
    grid-column:1;

    padding:8% 11% 8% 7%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:flex-start;

    background:#3F8580;

    color:#F8F2E8;
}


/* INTRO TEXT */

.hero-description{
    max-width:500px;

    margin:0 0 30px 0;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:17px;

    font-weight:400;

    line-height:1.85;

    color:#F8F2E8;
}


/* ABOUT BUTTON */

.outline-btn{
    display:inline-block;

    width:auto;

    padding:11px 20px;

    border:1px solid #F8F2E8;

    color:#F8F2E8;

    background:transparent;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:10px;

    font-weight:500;

    letter-spacing:1.7px;

    text-transform:uppercase;

    transition:
        background-color .3s ease,
        color .3s ease,
        border-color .3s ease;
}

.outline-btn:hover{
    background:#F8F2E8;

    color:#286C70;

    border-color:#F8F2E8;
}


/* RIGHT PHOTO */

.hero-photo{
    grid-column:2;

    min-height:560px;

    overflow:hidden;

    background:#D8CCB9;
}

.hero-photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* =====================================================
   LATEST WRITING
===================================================== */

.latest{
    width:94%;
    max-width:1500px;

    margin:55px auto 0;

    padding-top:28px;

    border-top:1px solid #D8CCB9;
}


/* SECTION TITLE */

.section-title{
    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:12px;

    font-weight:600;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#4D625F;

    margin-bottom:22px;
}


/* GRID */

.grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}


/* CARD */

.card{
    background:transparent;

    overflow:hidden;

    display:block;
}


/* COVER */

.cover{
    width:100%;

    aspect-ratio:4 / 5;

    overflow:hidden;

    background:#D8CCB9;

    position:relative;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .5s ease,
        filter .5s ease;
}


/* HOVER */

.card:hover .cover img{
    transform:scale(1.025);

    filter:saturate(1.08);
}


/* REMOVE ALL TITLES UNDER COVERS */

.card-info{
    display:none !important;
}

.card-number,
.card-title{
    display:none !important;
}


/* =====================================================
   CONTACT
===================================================== */

.contact-section{
    width:94%;
    max-width:1500px;

    margin:55px auto 0;

    padding:35px 0;

    border-top:1px solid #D8CCB9;

    text-align:center;
}


/* CONTACT TITLE */

.contact-section .section-title{
    margin-bottom:28px;
}


/* SOCIAL LINKS */

.social-links{
    display:flex;

    justify-content:center;

    align-items:center;

    gap:60px;

    flex-wrap:wrap;
}

.social-link{
    display:flex;

    flex-direction:column;

    align-items:center;

    gap:9px;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:10px;

    font-weight:500;

    letter-spacing:1.3px;

    text-transform:uppercase;

    color:#4F514B;

    transition:color .25s ease;
}

.social-link:hover{
    color:#3F8580;
}


/* ICON */

.social-icon{
    width:48px;
    height:48px;

    display:block;
}

.social-icon svg{
    width:100%;
    height:100%;

    fill:none;

    stroke:currentColor;

    stroke-width:1.6;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* LINKEDIN */

.linkedin-fill{
    fill:currentColor;

    stroke:none;
}

.linkedin-white{
    fill:#F3EBDD;

    stroke:none;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:55px;

    padding:24px 4vw;

    border-top:1px solid #D8CCB9;

    display:flex;

    justify-content:space-between;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:9px;

    font-weight:500;

    letter-spacing:1.8px;

    text-transform:uppercase;

    color:#77736D;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px){

    header{
        height:auto;

        min-height:68px;

        padding:14px 6vw;

        gap:15px;
    }


    .logo{
        font-size:14px !important;

        letter-spacing:1.8px;
    }


    nav{
        gap:12px;

        flex-wrap:wrap;

        justify-content:flex-end;
    }


    nav a{
        font-size:8px !important;

        letter-spacing:1px;
    }


    .contact-btn{
        padding:8px 12px;
    }


    /* HERO */

    .hero{
        width:92%;

        grid-template-columns:1fr;

        min-height:auto;

        margin-top:12px;
    }


    .hero-photo{
        grid-column:1;

        grid-row:1;

        min-height:480px;
    }


    .hero-text{
        grid-column:1;

        grid-row:2;

        padding:45px 8%;
    }


    .hero-description{
        font-size:16px;

        line-height:1.8;
    }


    /* WRITING */

    .latest{
        width:92%;
    }


    .grid{
        grid-template-columns:1fr;

        gap:18px;
    }


    /* CONTACT */

    .contact-section{
        width:92%;
    }


    .social-links{
        gap:35px;
    }


    /* FOOTER */

    footer{
        flex-direction:column;

        text-align:center;

        gap:10px;
    }

}

</style>

</head>
