<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bita Negahdar | Psychology</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   HOME PAGE
===================================================== */

:root{
    --cyan:#0891B2;
    --cyan-hover:#06B6D4;
    --cyan-light:#CFFAFE;

    --white:#FFFFFF;
    --text:#252525;
    --muted:#6D706D;
    --border:#D9E3DE;
}


/* =====================================================
   GLOBAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#FFFFFF !important;
    color:var(--text);

    font-family:"DM Sans",Arial,sans-serif !important;
    font-weight:400;
}

a{
    color:inherit;
    text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

header{
    width:100%;

    min-height:72px !important;

    padding:0 4vw !important;

    display:flex !important;
    align-items:center !important;
    justify-content:space-between !important;

    background:#FFFFFF !important;

    border-bottom:1px solid var(--border);

    position:relative;
}


/* =====================================================
   LOGO
===================================================== */

.logo{
    flex:0 0 auto;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:20px !important;
    font-weight:700 !important;

    letter-spacing:2.4px !important;

    line-height:1 !important;

    color:var(--text) !important;

    white-space:nowrap;
}


/* =====================================================
   NAVIGATION
===================================================== */

nav{
    display:flex !important;

    align-items:center !important;
    justify-content:flex-end !important;

    gap:24px !important;

    flex:0 0 auto;

    white-space:nowrap;
}

nav a{
    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    height:34px !important;
    min-height:34px !important;

    padding:7px 9px !important;

    border:1px solid transparent !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:11px !important;
    font-weight:600 !important;

    letter-spacing:1.5px !important;

    line-height:1 !important;

    text-transform:uppercase !important;

    color:#252525 !important;

    background:transparent !important;

    transition:
        background-color .25s ease,
        color .25s ease,
        border-color .25s ease !important;
}

nav a:hover{
    background:var(--cyan-hover) !important;

    border-color:var(--cyan-hover) !important;

    color:#FFFFFF !important;
}


/* =====================================================
   CONTACT BUTTON
===================================================== */

.contact-btn{
    height:34px !important;

    padding:8px 15px !important;

    background:var(--cyan-light) !important;

    border-color:var(--cyan-light) !important;

    color:var(--cyan) !important;
}

.contact-btn:hover{
    background:var(--cyan-hover) !important;

    border-color:var(--cyan-hover) !important;

    color:#FFFFFF !important;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:94% !important;

    max-width:1500px !important;

    margin:18px auto 0 !important;

    display:grid !important;

    grid-template-columns:44% 56% !important;

    min-height:560px !important;
}

.hero-text{
    grid-column:1 !important;

    padding:8% 11% 8% 7% !important;

    display:flex !important;

    flex-direction:column !important;

    justify-content:center !important;

    align-items:flex-start !important;

    background:var(--cyan) !important;

    color:#FFFFFF !important;
}


/* =====================================================
   HERO DESCRIPTION
===================================================== */

.hero-description{
    max-width:500px !important;

    margin:0 0 30px 0 !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:17px !important;

    font-weight:500 !important;

    line-height:1.85 !important;

    color:#FFFFFF !important;
}


/* =====================================================
   ABOUT BUTTON
===================================================== */

.outline-btn{
    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    padding:11px 20px !important;

    border:1px solid #FFFFFF !important;

    background:transparent !important;

    color:#FFFFFF !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:10px !important;

    font-weight:600 !important;

    letter-spacing:1.7px !important;

    line-height:1 !important;

    text-transform:uppercase !important;

    transition:
        background-color .25s ease,
        color .25s ease,
        border-color .25s ease !important;
}

.outline-btn:hover{
    background:var(--cyan-hover) !important;

    border-color:var(--cyan-hover) !important;

    color:#FFFFFF !important;
}


/* =====================================================
   RIGHT PHOTO
===================================================== */

.hero-photo{
    grid-column:2 !important;

    min-height:560px !important;

    overflow:hidden !important;

    background:#EEEEEE !important;
}

.hero-photo img{
    width:100% !important;

    height:100% !important;

    display:block !important;

    object-fit:cover !important;
}


/* =====================================================
   LATEST WRITING
===================================================== */

.latest{
    width:94% !important;

    max-width:1500px !important;

    margin:55px auto 0 !important;

    padding-top:28px !important;

    border-top:1px solid var(--border) !important;
}

.section-title{
    margin-bottom:24px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:12px !important;

    font-weight:700 !important;

    letter-spacing:2.2px !important;

    line-height:1.4 !important;

    text-transform:uppercase !important;

    color:var(--cyan) !important;
}


/* =====================================================
   WRITING GRID
===================================================== */

.grid{
    display:grid !important;

    grid-template-columns:repeat(3,minmax(0,1fr)) !important;

    gap:18px !important;

    width:100% !important;
}

.card{
    display:block !important;

    width:100% !important;

    background:#FFFFFF !important;

    overflow:hidden !important;

    transition:transform .3s ease !important;
}

.card:hover{
    transform:translateY(-5px) !important;
}


/* =====================================================
   WRITING COVER
===================================================== */

.cover{
    width:100% !important;

    aspect-ratio:4 / 5 !important;

    overflow:hidden !important;

    position:relative !important;

    background:var(--cyan-light) !important;

    border:1px solid transparent !important;

    transition:
        border-color .3s ease,
        box-shadow .3s ease !important;
}

.cover img{
    width:100% !important;

    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    transition:
        transform .45s ease,
        filter .3s ease !important;
}

.card:hover .cover{
    border-color:var(--cyan-hover) !important;

    box-shadow:
        0 10px 25px rgba(6,182,212,.18) !important;
}

.card:hover .cover img{
    transform:scale(1.045) !important;

    filter:saturate(1.12) brightness(1.03) !important;
}


/* =====================================================
   REMOVE TEXT UNDER COVERS
===================================================== */

.card-info,
.card-number,
.card-title{
    display:none !important;
}


/* =====================================================
   CONTACT SECTION
   CENTERED — NO BOXES
===================================================== */

.contact-section{
    width:94% !important;

    max-width:1500px !important;

    margin:55px auto 0 !important;

    padding:35px 0 40px !important;

    border-top:1px solid var(--border) !important;

    text-align:center !important;
}

.contact-section .section-title{
    margin-bottom:30px !important;
}


/* =====================================================
   PERSONAL CONTACT ICONS
===================================================== */

.social-links{
    display:flex !important;

    justify-content:center !important;

    align-items:center !important;

    gap:48px !important;

    flex-wrap:wrap !important;

    width:100% !important;

    margin-bottom:42px !important;
}

.social-link{
    display:flex !important;

    align-items:center !important;

    justify-content:center !important;

    width:58px !important;

    height:58px !important;

    background:transparent !important;

    border:none !important;

    box-shadow:none !important;

    border-radius:0 !important;

    transition:
        transform .25s ease,
        opacity .25s ease !important;
}

.social-link:hover{
    transform:translateY(-5px) scale(1.08) !important;

    background:transparent !important;

    border:none !important;

    box-shadow:none !important;

    opacity:.82 !important;
}


/* =====================================================
   UPLOADED CONTACT ICONS
===================================================== */

.social-icon{
    width:42px !important;

    height:42px !important;

    display:block !important;

    object-fit:contain !important;

    border:none !important;

    box-shadow:none !important;

    background:transparent !important;

    transition:transform .25s ease !important;
}

.social-link:hover .social-icon{
    transform:scale(1.08) !important;
}


/* =====================================================
   PROFESSIONAL / ACADEMIC RESOURCES
   LOGOS ONLY — CENTERED — NO BOXES
===================================================== */

.resource-links{
    display:flex !important;

    justify-content:center !important;

    align-items:center !important;

    gap:38px !important;

    flex-wrap:wrap !important;

    width:100% !important;

    margin-top:5px !important;
}

.resource-link{
    display:flex !important;

    align-items:center !important;

    justify-content:center !important;

    width:100px !important;

    height:58px !important;

    background:transparent !important;

    border:none !important;

    box-shadow:none !important;

    transition:
        transform .25s ease,
        opacity .25s ease !important;
}

.resource-link:hover{
    transform:translateY(-4px) scale(1.05) !important;

    background:transparent !important;

    border:none !important;

    box-shadow:none !important;

    opacity:.82 !important;
}

.resource-link img{
    max-width:100px !important;

    max-height:44px !important;

    width:auto !important;

    height:auto !important;

    display:block !important;

    object-fit:contain !important;

    border:none !important;

    box-shadow:none !important;

    background:transparent !important;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:55px !important;

    padding:24px 4vw !important;

    background:#FFFFFF !important;

    border-top:1px solid var(--border) !important;

    display:flex !important;

    align-items:center !important;

    justify-content:space-between !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:9px !important;

    font-weight:600 !important;

    letter-spacing:1.8px !important;

    line-height:1 !important;

    text-transform:uppercase !important;

    color:var(--muted) !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    header{
        min-height:72px !important;

        padding:14px 5vw !important;

        gap:15px !important;
    }

    .logo{
        font-size:14px !important;

        letter-spacing:1.8px !important;
    }

    nav{
        gap:6px !important;

        flex-wrap:wrap !important;

        justify-content:flex-end !important;
    }

    nav a{
        height:30px !important;

        min-height:30px !important;

        padding:5px 6px !important;

        font-size:8px !important;

        letter-spacing:1px !important;
    }

    .contact-btn{
        height:30px !important;

        padding:7px 10px !important;
    }


    /* HERO */

    .hero{
        width:92% !important;

        grid-template-columns:1fr !important;

        min-height:auto !important;
    }

    .hero-photo{
        grid-column:1 !important;

        grid-row:1 !important;

        min-height:480px !important;
    }

    .hero-text{
        grid-column:1 !important;

        grid-row:2 !important;

        padding:45px 8% !important;
    }

    .hero-description{
        font-size:16px !important;
    }


    /* WRITING */

    .latest{
        width:92% !important;
    }

    .grid{
        grid-template-columns:1fr !important;

        gap:18px !important;
    }


    /* CONTACT */

    .contact-section{
        width:92% !important;
    }

    .social-links{
        gap:26px !important;

        margin-bottom:35px !important;
    }

    .social-link{
        width:52px !important;

        height:52px !important;
    }

    .social-icon{
        width:38px !important;

        height:38px !important;
    }


    /* RESOURCES */

    .resource-links{
        gap:24px !important;
    }

    .resource-link{
        width:90px !important;

        height:52px !important;
    }

    .resource-link img{
        max-width:90px !important;

        max-height:40px !important;
    }


    /* FOOTER */

    footer{
        flex-direction:column !important;

        text-align:center !important;

        gap:10px !important;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

    .hero-photo{
        min-height:420px !important;
    }

    .hero-text{
        padding:40px 8% !important;
    }

    .hero-description{
        font-size:15px !important;
    }

    .social-links{
        gap:20px !important;
    }

    .social-link{
        width:48px !important;

        height:48px !important;
    }

    .social-icon{
        width:36px !important;

        height:36px !important;
    }

    .resource-links{
        gap:18px !important;
    }

    .resource-link{
        width:78px !important;

        height:48px !important;
    }

    .resource-link img{
        max-width:78px !important;

        max-height:36px !important;
    }

}

</style>

</head>
