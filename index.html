<style>

/* =====================================================
   HOME PAGE
===================================================== */

:root{

    --cyan-light:#CFFAFE;
}


/* =====================================================
   HEADER
   SAME STYLE AS CV
===================================================== */

header{
    background:#FFFFFF !important;
    padding-left:4vw !important;
    padding-right:4vw !important;
    min-height:72px !important;
}

.logo{
    font-family:"DM Sans", Arial, sans-serif !important;
    font-size:20px !important;
    font-weight:700 !important;
    letter-spacing:2.4px !important;
}

nav{
    display:flex !important;
    align-items:center !important;
    gap:28px !important;
}

nav a{
    display:inline-flex !important;
    align-items:center !important;
    justify-content:center !important;

    min-height:34px !important;
    padding:7px 9px !important;

    font-family:"DM Sans", Arial, sans-serif !important;
    font-size:11px !important;
    font-weight:600 !important;
    letter-spacing:1.5px !important;

    text-transform:uppercase !important;

    color:#252525 !important;

    transition:
        background-color .25s ease,
        color .25s ease !important;
}


/* SAME BLUE HOVER AS CV */

nav a:hover{
    background:#315F91 !important;
    color:#FFFFFF !important;
}


/* CONTACT */

.contact-btn{
    background:#E8F3EE !important;
    color:#315F59 !important;
}

.contact-btn:hover{
    background:#315F91 !important;
    color:#FFFFFF !important;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    width:94% !important;
    max-width:1500px !important;

    margin:18px auto 0 !important;

    display:grid !important;

    grid-template-columns:44% 56% !important;

    min-height:560px !important;
}


/* =====================================================
   LEFT COLORED PANEL
===================================================== */

.hero-text{
    grid-column:1 !important;

    padding:8% 11% 8% 7% !important;

    display:flex !important;
    flex-direction:column !important;
    justify-content:center !important;
    align-items:flex-start !important;

    background:#CFFAFE !important;

    color:#0891B2 !important;
}


/* TEXT */

.hero-description{
    max-width:500px !important;

    margin-bottom:30px !important;

    font-family:"DM Sans", Arial, sans-serif !important;

    font-size:17px !important;
    font-weight:500 !important;

    line-height:1.85 !important;

    color:#0891B2 !important;
}


/* =====================================================
   ABOUT BUTTON
===================================================== */

.outline-btn{
    display:inline-block !important;

    padding:11px 20px !important;

    border:1px solid #0891B2 !important;

    background:transparent !important;

    color:#0891B2 !important;

    font-family:"DM Sans", Arial, sans-serif !important;

    font-size:10px !important;
    font-weight:600 !important;

    letter-spacing:1.7px !important;

    text-transform:uppercase !important;

    transition:
        background-color .25s ease,
        color .25s ease,
        border-color .25s ease !important;
}


/* BLUE HOVER + WHITE TEXT */

.outline-btn:hover{
    background:#06B6D4 !important;

    border-color:#06B6D4 !important;

    color:#FFFFFF !important;
}


/* =====================================================
   RIGHT PHOTO
===================================================== */

.hero-photo{
    grid-column:2 !important;

    min-height:560px !important;

    overflow:hidden !important;

    background:#EEEEEE !important;
}

.hero-photo img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;
}


/* =====================================================
   LATEST WRITING
===================================================== */

.latest{
    width:94% !important;
    max-width:1500px !important;

    margin:55px auto 0 !important;

    padding-top:28px !important;

    border-top:1px solid #D9E3DE !important;
}

.section-title{

    font-weight:700 !important;

    letter-spacing:2.2px !important;

    text-transform:uppercase !important;

    color:#0891B2 !important;
}

.grid{
    display:grid !important;

    grid-template-columns:repeat(3,1fr) !important;

    gap:18px !important;
}


/* CARD */

.card{
    display:block !important;

    background:#FFFFFF !important;

    overflow:hidden !important;
}


/* COVER */

.cover{
    width:100% !important;

    aspect-ratio:4 / 5 !important;

    overflow:hidden !important;

    position:relative !important;

    background:#CFFAFE !important;
}

.cover img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    transition:
        transform .45s ease,
        filter .3s ease !important;
}

.card:hover .cover img{
    transform:scale(1.025) !important;
    filter:saturate(1.08) !important;
}


/* REMOVE ALL TEXT UNDER COVERS */

.card-info{
    display:none !important;
}

.card-number,
.card-title{
    display:none !important;
}


/* =====================================================
   CONTACT
===================================================== */

.contact-section{
    width:94% !important;
    max-width:1500px !important;

    margin:55px auto 0 !important;

    padding:35px 0 !important;

.contact-section .section-title{

}

.social-links{

    align-items:center !important;

    gap:60px !important;

    flex-wrap:wrap !important;
}

.social-link{

    align-items:center !important;

    gap:9px !important;

    font-size:10px !important;
    font-weight:600 !important;

    letter-spacing:1.3px !important;

    text-transform:uppercase !important;

    color:#4F514B !important;

    transition:color .25s ease !important;
}

.social-link:hover{
    color:#06B6D4 !important;
}


/* ICONS */

.social-icon{
    width:48px !important;
    height:48px !important;

    display:block !important;
}

.social-icon svg{
    width:100% !important;
    height:100% !important;

    fill:none;

    stroke:currentColor;

    stroke-width:1.6;

    stroke-linecap:round;
    stroke-linejoin:round;
}

.linkedin-fill{
    fill:currentColor;
    stroke:none;
}

.linkedin-white{
    fill:#FFFFFF;
    stroke:none;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:55px !important;

    padding:24px 4vw !important;

    background:#FFFFFF !important;

    border-top:1px solid #D9E3DE !important;

    display:flex !important;

    font-family:"DM Sans", Arial, sans-serif !important;

    font-size:9px !important;
    font-weight:600 !important;

    letter-spacing:1.8px !important;

    text-transform:uppercase !important;

    color:#6D706D !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    header{

    }

    }


    /* CONTACT */

    .contact-section{
        width:92% !important;
    }

    .social-links{
        gap:32px !important;
    }


    /* FOOTER */

    footer{
        flex-direction:column !important;

        text-align:center !important;

        gap:10px !important;
    }

}

</style>
