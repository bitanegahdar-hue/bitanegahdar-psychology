<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writing | Bita Negahdar</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   WRITING PAGE
===================================================== */

.writing-page{
    width:92%;
    max-width:1250px;
    margin:55px auto;
}


/* =====================================================
   HEADER TEXT
===================================================== */

.writing-page .eyebrow{
    margin-bottom:18px;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:11px;
    font-weight:700;

    letter-spacing:2px;

    text-transform:uppercase;

    color:#0891B2;
}

.writing-page h1{
    margin-bottom:28px;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:52px;
    font-weight:700;

    line-height:1.15;

    color:#252525;
}

.writing-intro{
    max-width:760px;

    margin-bottom:60px;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:16px;
    font-weight:400;

    line-height:2;

    color:#5F6668;
}


/* =====================================================
   WRITING GRID
===================================================== */

.writing-grid{
    display:grid;

    grid-template-columns:repeat(3,minmax(0,1fr));

    gap:18px;

    width:100%;
}


/* =====================================================
   WRITING CARD
===================================================== */

.writing-card{
    display:block;

    width:100%;

    background:#FFFFFF;

    overflow:hidden;

    text-decoration:none;

    transition:
        transform .3s ease;
}

.writing-card:hover{
    transform:translateY(-6px);
}


/* =====================================================
   COVER
===================================================== */

.writing-cover{
    width:100%;

    aspect-ratio:4 / 5;

    overflow:hidden;

    position:relative;

    background:#CFFAFE;

    border:1px solid #D9E5E8;

    transition:
        border-color .3s ease,
        box-shadow .3s ease;
}


/* =====================================================
   IMAGE
===================================================== */

.writing-cover img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .5s ease,
        filter .35s ease;
}


/* =====================================================
   HOVER EFFECT
===================================================== */

.writing-card:hover .writing-cover{
    border-color:#06B6D4;

    box-shadow:
        0 14px 35px rgba(8,145,178,.16);
}

.writing-card:hover .writing-cover img{
    transform:scale(1.045);

    filter:saturate(1.08) brightness(1.02);
}


/* =====================================================
   HEADER
   SAME MENU ON ALL PAGES
===================================================== */

header{
    width:100%;

    min-height:76px;
    height:76px;

    padding:0 4vw;

    display:flex;

    align-items:center;
    justify-content:space-between;

    background:#FFFFFF;

    border-bottom:1px solid #D9E5E8;
}


/* =====================================================
   LOGO
===================================================== */

.logo{
    font-family:"DM Sans",Arial,sans-serif;

    font-size:20px;
    font-weight:700;

    letter-spacing:2.4px;

    color:#252525;

    white-space:nowrap;
}


/* =====================================================
   NAVIGATION
   HOME / ABOUT / WRITING / CONTACT
===================================================== */

nav{
    display:flex;

    align-items:center;
    justify-content:flex-end;

    gap:24px;

    flex-shrink:0;

    white-space:nowrap;
}

nav a{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    min-height:38px;
    height:38px;

    padding:7px 11px;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:12px;
    font-weight:600;

    letter-spacing:1.4px;

    line-height:1;

    text-transform:uppercase;

    text-decoration:none;

    color:#252525;

    background:transparent;

    border:1px solid transparent;

    transition:
        background-color .25s ease,
        color .25s ease,
        border-color .25s ease;
}


/* =====================================================
   NAV HOVER
===================================================== */

nav a:hover{
    background:#06B6D4;

    border-color:#06B6D4;

    color:#FFFFFF;
}


/* =====================================================
   CONTACT BUTTON
===================================================== */

.contact-btn{
    padding:9px 17px;

    background:#CFFAFE;

    border:1px solid #CFFAFE;

    color:#0891B2 !important;
}

.contact-btn:hover{
    background:#06B6D4;

    border-color:#06B6D4;

    color:#FFFFFF !important;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:55px;

    padding:24px 4vw;

    background:#FFFFFF;

    border-top:1px solid #D9E5E8;

    display:flex;

    align-items:center;
    justify-content:space-between;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:9px;
    font-weight:600;

    letter-spacing:1.8px;

    line-height:1.4;

    text-transform:uppercase;

    color:#626A6D;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    header{
        min-height:72px;
        height:auto;

        padding:14px 5vw;

        gap:15px;
    }


    .logo{
        font-size:14px;

        letter-spacing:1.8px;
    }


    nav{
        gap:6px;

        flex-wrap:wrap;

        justify-content:flex-end;
    }


    nav a{
        min-height:30px;
        height:30px;

        padding:5px 6px;

        font-size:8px;

        letter-spacing:1px;
    }


    .contact-btn{
        padding:7px 10px;
    }


    /* PAGE */

    .writing-page{
        width:90%;

        margin:45px auto;
    }


    .writing-page h1{
        font-size:40px;
    }


    .writing-intro{
        font-size:15px;

        margin-bottom:45px;
    }


    /* GRID */

    .writing-grid{
        grid-template-columns:1fr;

        gap:30px;
    }


    /* FOOTER */

    footer{
        flex-direction:column;

        text-align:center;

        gap:10px;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

    .writing-page h1{
        font-size:36px;
    }


    .writing-cover{
        aspect-ratio:4 / 5;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <div class="logo">
        BITA NEGAHDAR
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="about.html">
            About
        </a>

        <a href="writing.html">
            Writing
        </a>

        <a href="index.html#contact" class="contact-btn">
            Contact
        </a>

    </nav>

</header>


<!-- =====================================================
     WRITING CONTENT
===================================================== -->

<main class="writing-page">


    <div class="eyebrow">
        Writing
    </div>


    <h1>
        Writing
    </h1>


    <p class="writing-intro">

        Reflections on identity, psychological experience,
        human behavior, and the relationship between the
        individual and the world around them.

    </p>


    <!-- =================================================
         WRITING GRID
    ================================================= -->

    <div class="writing-grid">


        <!-- =============================================
             WRITING 01
        ============================================== -->

        <a href="writing-1.html" class="writing-card">

            <div class="writing-cover">

                <picture>

                    <source
                        srcset="images/cover-1.jpg"
                        type="image/jpeg"
                    >

                    <img
                        src="images/cover-1.jpeg"
                        alt="The Self Attached to Things"
                    >

                </picture>

            </div>

        </a>


        <!-- =============================================
             WRITING 02
        ============================================== -->

        <a href="writing-2.html" class="writing-card">

            <div class="writing-cover">

                <picture>

                    <source
                        srcset="images/cover-2.jpg"
                        type="image/jpeg"
                    >

                    <img
                        src="images/cover-2.jpeg"
                        alt="When Success Becomes Self-Sacrifice"
                    >

                </picture>

            </div>

        </a>


        <!-- =============================================
             WRITING 03
        ============================================== -->

        <a href="writing-3.html" class="writing-card">

            <div class="writing-cover">

                <picture>

                    <source
                        srcset="images/cover-3.jpg"
                        type="image/jpeg"
                    >

                    <img
                        src="images/cover-3.jpeg"
                        alt="The Self That Remains"
                    >

                </picture>

            </div>

        </a>


    </div>

</main>


<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <div>
        BITA NEGAHDAR
    </div>

    <div>
        Psychology
    </div>

</footer>


</body>

</html>
