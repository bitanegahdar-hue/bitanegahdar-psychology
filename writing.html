<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writing | Bita Negahdar</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   WRITING PAGE
===================================================== */

.page{
    width:92% !important;
    max-width:1250px !important;
    margin:55px auto !important;
}


/* =====================================================
   TITLE
===================================================== */

.eyebrow{
    margin-bottom:18px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:11px !important;
    font-weight:700 !important;

    letter-spacing:2px !important;

    text-transform:uppercase !important;

    color:#0891B2 !important;
}

.page h1{
    margin-bottom:45px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:52px !important;
    font-weight:700 !important;

    line-height:1.15 !important;

    color:#252525 !important;
}


/* =====================================================
   WRITING GRID
===================================================== */

.grid{
    display:grid !important;

    grid-template-columns:repeat(3,minmax(0,1fr)) !important;

    gap:18px !important;

    width:100% !important;
}


/* =====================================================
   CARD
===================================================== */

.card{
    display:block !important;

    width:100% !important;

    background:#FFFFFF !important;

    overflow:hidden !important;

    text-decoration:none !important;

    transition:transform .3s ease !important;
}

.card:hover{
    transform:translateY(-5px) !important;
}


/* =====================================================
   COVER
===================================================== */

.cover{
    width:100% !important;

    aspect-ratio:4 / 5 !important;

    overflow:hidden !important;

    position:relative !important;

    background:#CFFAFE !important;

    border:1px solid #D9E5E8 !important;
}


/* =====================================================
   COVER IMAGE
===================================================== */

.cover img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    transition:
        transform .5s ease,
        filter .4s ease !important;
}


/* =====================================================
   STRONG HOVER OVERLAY
===================================================== */

.cover::after{
    content:"VIEW WRITING";

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    background:rgba(6,182,212,.78);

    color:#FFFFFF;

    font-family:"DM Sans",Arial,sans-serif;

    font-size:11px;

    font-weight:700;

    letter-spacing:2px;

    opacity:0;

    transform:scale(.96);

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =====================================================
   IMAGE HOVER
===================================================== */

.card:hover .cover img{
    transform:scale(1.055);

    filter:saturate(1.12);
}


/* =====================================================
   OVERLAY HOVER
===================================================== */

.card:hover .cover::after{
    opacity:1;

    transform:scale(1);
}


/* =====================================================
   REMOVE ALL TEXT UNDER COVERS
===================================================== */

.card-info,
.card-number,
.card-title{
    display:none !important;
}


/* =====================================================
   HEADER
   SAME ON EVERY PAGE
===================================================== */

header{
    width:100% !important;

    min-height:76px !important;
    height:76px !important;

    padding:0 4vw !important;

    display:flex !important;
    align-items:center !important;
    justify-content:space-between !important;

    background:#FFFFFF !important;

    border-bottom:1px solid #D9E5E8 !important;
}

.logo{
    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:20px !important;
    font-weight:700 !important;

    letter-spacing:2.4px !important;

    color:#252525 !important;

    white-space:nowrap !important;
}

nav{
    display:flex !important;

    align-items:center !important;
    justify-content:flex-end !important;

    gap:24px !important;

    flex-shrink:0 !important;

    white-space:nowrap !important;
}

nav a{
    display:inline-flex !important;

    align-items:center !important;
    justify-content:center !important;

    min-height:38px !important;
    height:38px !important;

    padding:7px 11px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:12px !important;
    font-weight:600 !important;

    letter-spacing:1.4px !important;

    line-height:1 !important;

    text-transform:uppercase !important;

    color:#252525 !important;

    background:transparent !important;

    border:1px solid transparent !important;

    white-space:nowrap !important;

    transition:
        background-color .25s ease,
        color .25s ease,
        border-color .25s ease !important;
}


/* =====================================================
   NAV HOVER
===================================================== */

nav a:hover{
    background:#06B6D4 !important;

    border-color:#06B6D4 !important;

    color:#FFFFFF !important;
}


/* =====================================================
   CONTACT BUTTON
===================================================== */

.contact-btn{
    padding:9px 17px !important;

    background:#CFFAFE !important;

    border:1px solid #CFFAFE !important;

    color:#0891B2 !important;
}

.contact-btn:hover{
    background:#06B6D4 !important;

    border-color:#06B6D4 !important;

    color:#FFFFFF !important;
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:55px !important;

    padding:24px 4vw !important;

    background:#FFFFFF !important;

    border-top:1px solid #D9E5E8 !important;

    display:flex !important;

    align-items:center !important;

    justify-content:space-between !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:9px !important;

    font-weight:600 !important;

    letter-spacing:1.8px !important;

    text-transform:uppercase !important;

    color:#626A6D !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    header{
        min-height:72px !important;
        height:auto !important;

        padding:14px 5vw !important;

        gap:15px !important;
    }

    .logo{
        font-size:14px !important;

        letter-spacing:1.8px !important;
    }

    nav{
        gap:6px !important;

        flex-wrap:wrap !important;

        justify-content:flex-end !important;
    }

    nav a{
        min-height:30px !important;
        height:30px !important;

        padding:5px 6px !important;

        font-size:8px !important;

        letter-spacing:1px !important;
    }

    .contact-btn{
        padding:7px 10px !important;
    }


    /* PAGE */

    .page{
        width:90% !important;

        margin:45px auto !important;
    }

    .page h1{
        font-size:40px !important;

        margin-bottom:35px !important;
    }


    /* GRID */

    .grid{
        grid-template-columns:1fr !important;

        gap:30px !important;
    }


    /* FOOTER */

    footer{
        flex-direction:column !important;

        text-align:center !important;

        gap:10px !important;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

    .page h1{
        font-size:36px !important;
    }

    .cover{
        aspect-ratio:4 / 5 !important;
    }

    .cover::after{
        font-size:10px;
        letter-spacing:1.7px;
    }

}

</style>
