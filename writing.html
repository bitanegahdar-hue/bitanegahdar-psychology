<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Writing | Bita Negahdar</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   WRITING PAGE
===================================================== */

.page{
    width:92% !important;
    max-width:1250px !important;
    margin:55px auto !important;
}


/* =====================================================
   TITLE
===================================================== */

.eyebrow{
    margin-bottom:18px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:11px !important;
    font-weight:700 !important;

    letter-spacing:2px !important;

    text-transform:uppercase !important;

    color:#0891B2 !important;
}

.page h1{
    margin-bottom:45px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:52px !important;
    font-weight:700 !important;

    line-height:1.15 !important;

    color:#252525 !important;
}


/* =====================================================
   WRITING GRID
===================================================== */

.grid{
    display:grid !important;

    grid-template-columns:repeat(3,minmax(0,1fr)) !important;

    gap:18px !important;

    width:100% !important;
}


/* =====================================================
   CARD
===================================================== */

.card{
    display:block !important;

    width:100% !important;

    background:#FFFFFF !important;

    overflow:hidden !important;

    transition:transform .25s ease !important;
}

.card:hover{
    transform:translateY(-4px) !important;
}


/* =====================================================
   COVER
===================================================== */

.cover{
    width:100% !important;

    aspect-ratio:4 / 5 !important;

    overflow:hidden !important;

    position:relative !important;

    background:#CFFAFE !important;

    border:1px solid #D9E5E8 !important;
}

.cover img{
    width:100% !important;
    height:100% !important;

    display:block !important;

    object-fit:cover !important;

    transition:
        transform .45s ease,
        filter .3s ease !important;
}


/* =====================================================
   IMAGE HOVER
===================================================== */

.card:hover .cover img{
    transform:scale(1.025) !important;

    filter:saturate(1.08) !important;
}


/* =====================================================
   CARD INFO
===================================================== */

.card-info{
    display:block !important;

    padding:14px 2px 24px !important;
}


/* =====================================================
   WRITING NUMBER
===================================================== */

.card-number{
    display:block !important;

    margin-bottom:7px !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:10px !important;

    font-weight:700 !important;

    letter-spacing:1.8px !important;

    text-transform:uppercase !important;

    color:#0891B2 !important;
}


/* =====================================================
   WRITING TITLE
===================================================== */

.card-title{
    display:block !important;

    font-family:"DM Sans",Arial,sans-serif !important;

    font-size:18px !important;

    font-weight:600 !important;

    line-height:1.4 !important;

    color:#252525 !important;

    transition:color .25s ease !important;
}

.card:hover .card-title{
    color:#06B6D4 !important;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .page{
        width:90% !important;

        margin:45px auto !important;
    }

    .page h1{
        font-size:40px !important;

        margin-bottom:35px !important;
    }

    .grid{
        grid-template-columns:1fr !important;

        gap:30px !important;
    }

}


/* =====================================================
   SMALL MOBILE
===================================================== */

@media(max-width:480px){

    .page h1{
        font-size:36px !important;
    }

    .cover{
        aspect-ratio:4 / 5 !important;
    }

}

</style>

</head>


<body>

===================================================== -->

    </div>


    <nav>

        </a>

        </a>

        <a href="index.html#contact" class="contact-btn">
            Contact
        </a>

    </nav>

</header>

<main class="page">

        Writing

        Selected Writing

    <div class="grid">


        <!-- =================================================

        <a href="writing-1.html" class="card">

            <div class="cover">

                <img
                    src="images/cover-1.jpeg"

                >

            </div>


            <div class="card-info">

                <div class="card-title">

        <!-- =================================================

        <!-- =================================================

</main>

<footer>

</footer>


</body>
</html>
